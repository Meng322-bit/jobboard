services:
  api-gateway:
    build: ./api-gateway
    ports:
      - "5000:5000"
    env_file: ./.env
    environment:
      - PORT=5000
      - REGISTER_SERVICE_URL=http://registration-service:5001
      - LOGIN_SERVICE_URL=http://login-service:5002
      - JOB_LISTING_SERVICE_URL=http://172.31.31.68:5003
      - APPLICANT_SERVICE_URL=http://172.31.31.68:5004
      - JOB_SEARCH_SERVICE_URL=http://nginx:8080
      - APPLICATION_SERVICE_URL=http://172.31.31.99:5006
    depends_on:
      - registration-service
      - login-service
      - nginx

  nginx:
    image: nginx:alpine
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/nginx.ec2.conf:/etc/nginx/nginx.conf:ro

  registration-service:
    build: ./registration-service
    ports:
      - "5001:5001"
    env_file: ./.env
    environment:
      - PORT=5001

  login-service:
    build: ./login-service
    ports:
      - "5002:5002"
    env_file: ./.env
    environment:
      - PORT=5002